services:
  postgres:
    image: postgres:15-alpine
    container_name: daydream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daydream_portal}
      POSTGRES_USER: ${POSTGRES_USER:-daydream_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./setup-db.sql:/docker-entrypoint-initdb.d/02_setup_complete.sql
    command: >
      postgres
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement='all'
      -c shared_preload_libraries='pg_stat_statements'
    networks:
      - daydream-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daydream_user} -d ${POSTGRES_DB:-daydream_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  daydream-network:
    driver: bridge